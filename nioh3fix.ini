; =====================================================================================
;  Nioh3Fix settings
; =====================================================================================
;  The defaults below are meant for every PC (any Intel/AMD processor, any NVIDIA/AMD/Intel
;  graphics card, laptops included). You do not need to change anything.
;
;  - 1 means ON, 0 means OFF.
;  - You can edit this file while the game is running; changes apply within 2 seconds
;    (except the [VariableTimestep] section at the bottom, which is read when the game starts).
;  - In game, set Frame Rate Cap to "120 (fixed)" for the smoothest result.
;  - If something seems wrong, set a feature to 0, compare, and see Nioh3Fix_README.txt.
; =====================================================================================

[Nioh3Fix]

; ---------------- STUTTER FIX ----------------------------------------------------------

; VariableTimestep: the main stutter fix.
;   The game moves in fixed steps of 1/120 of a second. When your PC renders fewer than
;   120 frames per second, some frames show one step and some show two, which looks like
;   constant micro-stutter. With this ON, every frame shows exactly the time that passed,
;   so movement is smooth at any frame rate (for example 75, 90 or 110 fps).
;   It turns itself off by itself in menus, cutscenes, loading screens and online play.
VariableTimestep=1

; VfrMinFps: if your frame rate stays below this number for 2 seconds, the fix switches to
;   "even pacing" instead (smooth 40 or 30 fps), which keeps the game running at full speed.
;   It switches back automatically when your PC is fast enough again.
;   58 works well for almost everyone. Raise it (e.g. 70) if you prefer a locked, even
;   40/60 fps over a variable 60-70 fps.
VfrMinFps=58

; VfrAllowOnline: 1 = also use VariableTimestep in co-op / online play.
;   Off by default because it has not been tested online. Leave at 0 unless you want to try it.
VfrAllowOnline=0

; Pacer: "even pacing" - used whenever VariableTimestep is not active (or turned off).
;   Shows frames at a steady rate that fits the game's 120 steps per second
;   (120, 60, 40 or 30 fps), so every frame moves the same amount.
;   1 = automatic (picks the fastest steady rate your PC can hold)   <- recommended
;   0 = off (the game's own, uneven frame timing)
;   60 / 40 / 30 = always use that rate
;   Only active with the "120 (fixed)" cap; at "60 (fixed)" the game is already even.
Pacer=1

; Fine-tuning for the pacer. Leave these as they are.
;   PacerSpinUs:  how many microseconds before a frame's slot the pacer stops sleeping and
;                 waits precisely (higher = more exact timing, slightly more CPU).
;   PacerVblank:  1 = line frames up with your monitor's refresh (less uneven frame display).
;   PacerPhaseUs: how long after a monitor refresh frames are released, in microseconds.
PacerSpinUs=700
PacerVblank=1
PacerPhaseUs=500

; ---------------- CPU USAGE FIXES -------------------------------------------------------
;  The game keeps several processor cores 100% busy just "waiting" (checking again and
;  again whether it may continue). These fixes let those threads rest in very short naps
;  instead. They never make the game wait longer than it would have, so speed and timing
;  are unchanged; your PC simply runs cooler and has more power left for real work.
;  Set any of them to 0 to turn it off.

; PumpFix: the game's window thread checks for keyboard/mouse messages non-stop.
;   1 = it waits for messages instead (wakes up instantly when one arrives).
;   PumpWaitUs: longest wait between checks, in microseconds.
PumpFix=1
PumpWaitUs=500

; GatePollUs: the render thread waits for work in busy 1-millisecond loops.
;   This sets a short nap in microseconds instead (100 = check again every 0.1 ms).
;   0 = off (keep the game's busy waiting).
GatePollUs=100

; UpdateNap: the game-logic thread spins a full core between its updates.
;   1 = nap until just before the next update is due (it reads the game's own schedule,
;   so updates are never late). GateNapUs: nap length in microseconds.
UpdateNap=1
GateNapUs=100

; FenceNap: the render thread spins while waiting for the graphics card to finish a frame.
;   1 = after a short normal wait (FenceSpinUs), nap in short slices (FenceNapUs).
FenceNap=1
FenceSpinUs=300
FenceNapUs=100

; DrainNap: the render thread spins while its command queue empties.
;   1 = after a short normal wait (DrainSpinUs), nap in short slices (DrainNapUs).
DrainNap=1
DrainSpinUs=200
DrainNapUs=100


[VariableTimestep]
; Advanced options for VariableTimestep. Read when the game starts.

; StartEnabled: 1 = VariableTimestep is on when the game starts.
StartEnabled=1

; ToggleKey: press this key in game to switch VariableTimestep on/off, to compare.
;   Examples: F10, F11, Ctrl+F10, Insert. "None" disables the key.
ToggleKey=F10

; TimingMode: Raw = each step matches the last frame exactly (recommended).
;             Smooth = steps are averaged over AvgFrames frames (SmoothK = how quickly it
;             catches up, 0.01-1). Only try Smooth if Raw looks jittery on your PC.
TimingMode=Raw
AvgFrames=8
SmoothK=0.2

; ScaleMin / ScaleMax: the smallest and largest step, compared with a normal 1/120 s step.
;   2.0 means one frame may cover up to 2 steps (= down to 60 fps). Leave as is.
ScaleMin=0.5
ScaleMax=2.0
